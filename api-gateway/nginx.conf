events {}

http {
    # Эти map-блоки нужны для WebSocket upgrade и единого correlationId на входящем запросе.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        '' $request_id;
    }
    map $http_authorization $gateway_authorization {
        default $http_authorization;
        '' "Bearer $arg_access_token";
    }

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
    limit_req_status 429;

    # Gateway тоже пишет JSON-логи в stdout, чтобы формат совпадал с backend-сервисами.
    log_format json_logs escape=json
        '{"timestamp":"$time_iso8601",'
        '"level":"Information",'
        '"service":"api-gateway",'
        '"correlationId":"$correlation_id",'
        '"message":"HTTP request completed",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"statusCode":$status,'
        '"elapsedMs":$request_time}';
    access_log /dev/stdout json_logs;
    error_log /dev/stderr warn;

    upstream user_service {
        server user-service:8080;
    }

    upstream wishlist_service {
        server wishlist-service:8080;
    }

    upstream chat_service {
        server chat-service:8080;
    }

    upstream notification_service {
        server notification-service:8080;
    }

    server {
        listen 8080;

        # CORS включен для demo frontend-а, который работает на отдельном localhost-порту.
        set $cors_origin "*";
        set $cors_methods "GET,POST,PUT,PATCH,DELETE,OPTIONS";
        set $cors_headers "Authorization,Content-Type,X-Correlation-ID";
        set $cors_expose_headers "X-Correlation-ID";
        add_header X-Correlation-ID $correlation_id always;

        location = /health {
            default_type application/json;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        location = /_auth_validate {
            internal;
            proxy_pass http://user_service/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $gateway_authorization;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /auth/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://user_service;
        }

        location = /users/health {
            limit_req zone=api_per_ip burst=20 nodelay;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://user_service;
        }

        location /users/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            auth_request /_auth_validate;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://user_service;
        }

        location = /wishlists/health {
            limit_req zone=api_per_ip burst=20 nodelay;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://wishlist_service;
        }

        location /wishlists/public/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://wishlist_service;
        }

        location /wishlists/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            auth_request /_auth_validate;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://wishlist_service;
        }

        location = /wishlists {
            limit_req zone=api_per_ip burst=20 nodelay;
            auth_request /_auth_validate;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://wishlist_service;
        }

        location = /chat/health {
            limit_req zone=api_per_ip burst=20 nodelay;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://chat_service;
        }

        location = /chat/ws {
            limit_req zone=api_per_ip burst=20 nodelay;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            # Browser WebSocket cannot send Authorization header, so chat-service validates access_token.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://chat_service;
        }

        location = /chat/notifications/ws {
            limit_req zone=api_per_ip burst=20 nodelay;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            # Browser WebSocket cannot send Authorization header, so chat-service validates access_token.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://chat_service;
        }

        location /chat/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            auth_request /_auth_validate;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://chat_service;
        }

        location /messages/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            auth_request /_auth_validate;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://chat_service;
        }

        location = /notifications/health {
            limit_req zone=api_per_ip burst=20 nodelay;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://notification_service;
        }

        location /notifications/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            auth_request /_auth_validate;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://notification_service;
        }
    }
}
