events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        '' $request_id;
    }

    log_format json_logs escape=json
        '{"timestamp":"$time_iso8601",'
        '"level":"Information",'
        '"service":"api-gateway",'
        '"correlationId":"$correlation_id",'
        '"message":"HTTP request completed",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"statusCode":$status,'
        '"elapsedMs":$request_time}';
    access_log /dev/stdout json_logs;
    error_log /dev/stderr warn;

    upstream user_service {
        server user-service:8080;
    }

    upstream wishlist_service {
        server wishlist-service:8080;
    }

    upstream chat_service {
        server chat-service:8080;
    }

    upstream notification_service {
        server notification-service:8080;
    }

    server {
        listen 8080;

        set $cors_origin "*";
        set $cors_methods "GET,POST,PUT,PATCH,DELETE,OPTIONS";
        set $cors_headers "Authorization,Content-Type,X-Correlation-ID";
        set $cors_expose_headers "X-Correlation-ID";
        add_header X-Correlation-ID $correlation_id always;

        location = /health {
            default_type application/json;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        location /auth/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://user_service;
        }

        location /users/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://user_service;
        }

        location /wishlists/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://wishlist_service;
        }

        location = /wishlists {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://wishlist_service;
        }

        location /chat/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://chat_service;
        }

        location /messages/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://chat_service;
        }

        location /notifications/ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers $cors_expose_headers always;
            if ($request_method = OPTIONS) { return 204; }
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_pass http://notification_service;
        }
    }
}
