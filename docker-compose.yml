services:
  # Frontend собирается с адресом API Gateway и отдается через Nginx.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: wishlist-frontend
    ports:
      - "3001:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_healthy
      wishlist-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=user-db;Port=5432;Database=wishlist_user;Username=${POSTGRES_USER:-wishlist};Password=${POSTGRES_PASSWORD:-wishlist}
      Jwt__Issuer: ${JWT_ISSUER:-wishlist-user-service}
      Jwt__Audience: ${JWT_AUDIENCE:-wishlist-clients}
      Jwt__Key: ${JWT_SECRET:-wishlist-super-secret-key-change-me-please}
    depends_on:
      user-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  wishlist-service:
    build:
      context: ./wishlist-service
    container_name: wishlist-service
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=wishlist-db;Port=5432;Database=wishlist_wishlist;Username=${POSTGRES_USER:-wishlist};Password=${POSTGRES_PASSWORD:-wishlist}
      Jwt__Issuer: ${JWT_ISSUER:-wishlist-user-service}
      Jwt__Audience: ${JWT_AUDIENCE:-wishlist-clients}
      Jwt__Key: ${JWT_SECRET:-wishlist-super-secret-key-change-me-please}
      UserService__BaseUrl: http://user-service:8080
      UserService__TimeoutSeconds: 2
      UserService__RetryCount: 2
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMq__VirtualHost: /
      RabbitMq__Exchange: wishlist.events
      Outbox__BatchSize: 20
      Outbox__PollIntervalMilliseconds: 2000
    depends_on:
      # Для outbox достаточно, чтобы RabbitMQ стартовал; worker сам повторит подключение при ошибке.
      wishlist-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  chat-service:
    build:
      context: ./chat-service
    container_name: chat-service
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=chat-db;Port=5432;Database=wishlist_chat;Username=${POSTGRES_USER:-wishlist};Password=${POSTGRES_PASSWORD:-wishlist}
      Jwt__Issuer: ${JWT_ISSUER:-wishlist-user-service}
      Jwt__Audience: ${JWT_AUDIENCE:-wishlist-clients}
      Jwt__Key: ${JWT_SECRET:-wishlist-super-secret-key-change-me-please}
      UserService__BaseUrl: http://user-service:8080
      UserService__TimeoutSeconds: 2
      UserService__RetryCount: 2
      WishlistService__BaseUrl: http://wishlist-service:8080
      WishlistService__TimeoutSeconds: 2
      WishlistService__RetryCount: 2
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMq__VirtualHost: /
      RabbitMq__Exchange: wishlist.events
      RabbitMq__Queue: chat.wishlist-created
      Outbox__BatchSize: 20
      Outbox__PollIntervalMilliseconds: 2000
    depends_on:
      chat-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=notification-db;Port=5432;Database=wishlist_notification;Username=${POSTGRES_USER:-wishlist};Password=${POSTGRES_PASSWORD:-wishlist}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      RabbitMq__VirtualHost: /
      RabbitMq__Exchange: wishlist.events
      RabbitMq__Queue: notification.wishlist-events
    depends_on:
      # Consumer тоже умеет переподключаться, поэтому здесь не требуется строгий RabbitMQ healthcheck.
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: wishlist_user
      POSTGRES_USER: ${POSTGRES_USER:-wishlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wishlist}
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wishlist} -d wishlist_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wishlist-db:
    image: postgres:16-alpine
    container_name: wishlist-db
    environment:
      POSTGRES_DB: wishlist_wishlist
      POSTGRES_USER: ${POSTGRES_USER:-wishlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wishlist}
    ports:
      - "5434:5432"
    volumes:
      - wishlist-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wishlist} -d wishlist_wishlist"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chat-db:
    image: postgres:16-alpine
    container_name: chat-db
    environment:
      POSTGRES_DB: wishlist_chat
      POSTGRES_USER: ${POSTGRES_USER:-wishlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wishlist}
    ports:
      - "5435:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wishlist} -d wishlist_chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  notification-db:
    image: postgres:16-alpine
    container_name: notification-db
    environment:
      POSTGRES_DB: wishlist_notification
      POSTGRES_USER: ${POSTGRES_USER:-wishlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wishlist}
    ports:
      - "5436:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wishlist} -d wishlist_notification"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  # Volumes сохраняют данные между перезапусками; для чистого старта используйте docker compose down -v.
  user-db-data:
  wishlist-db-data:
  chat-db-data:
  notification-db-data:
  grafana-data:
